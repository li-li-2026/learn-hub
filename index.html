<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创作工作台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-header">
      <h1>创作工作台</h1>
      <p>9 大模块 · 每日打卡 · 视频学习</p>
    </header>
    <nav class="nav" id="nav" aria-label="模块导航"></nav>
  </aside>

  <main class="content" id="content">
    <header class="content-header">
      <h2 id="module-title">模块</h2>
      <p id="module-subtitle" class="muted"></p>
    </header>

    <section class="task-section">
      <h3 class="section-title">📋 今日任务清单</h3>
      <ul class="task-list" id="task-list" aria-label="任务清单"></ul>
      <form class="add-task-form" id="add-task-form">
        <input type="text" id="task-input" placeholder="新增一个今日任务..." maxlength="50" required />
        <button type="submit" class="btn-add">添加</button>
      </form>
      <p class="task-progress" id="task-progress"></p>
    </section>

    <section class="options-section">
      <h3 class="section-title">🎬 子选项 / 相关视频</h3>
      <div id="options" class="options-list"></div>
    </section>

    <section class="calendar-section">
      <h3 class="section-title">📅 打卡日历</h3>
      <div id="calendar" class="calendar"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
