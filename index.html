<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创作工作台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-header">
      <h1>创作工作台</h1>
      <p>完成一项打勾，进度一目了然</p>
    </header>
    <nav class="nav" id="nav" aria-label="模块导航"></nav>
  </aside>

  <main class="content" id="content">
    <section class="task-section">
      <h2 class="section-title">📋 今日任务清单</h2>
      <ul class="task-list" id="task-list" aria-label="任务清单"></ul>
      <form class="add-task-form" id="add-task-form">
        <input type="text" id="task-input" placeholder="新增一个今日任务..." maxlength="50" required />
        <button type="submit" class="btn-add">添加</button>
      </form>
      <p class="task-progress" id="task-progress"></p>
    </section>

    <section class="video-section">
      <h2 class="section-title">🎬 相关视频 / 知识点</h2>
      <ul class="video-list" id="video-list" aria-label="视频列表"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
